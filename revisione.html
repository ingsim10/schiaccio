<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QUARTO · revisione (solo Simone)</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#F1E7D2; --surface:#FFFFFF; --ink:#1E2A33; --muted:#5C6B76;
    --line:#E4D9C2; --coral:#D6431F; --blue:#156FA3; --blue-bg:#DFEFF9;
    --warn:#B08900; --warn-bg:#FCF2CF;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10161C; --surface:#1A232C; --ink:#EDF3F7; --muted:#93A3AE;
      --line:#2A3641; --coral:#E85433; --blue:#5FB0E5; --blue-bg:#14384E;
      --warn:#E8C547; --warn-bg:#2B2410; }
  }
  body{margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Segoe UI",Roboto,sans-serif; padding:24px;}
  h1{font-size:20px; margin:0 0 4px;}
  p.lead{color:var(--muted); font-size:13px; margin:0 0 20px;}
  .gate{max-width:420px; margin:80px auto; text-align:center;}
  .gate button{padding:12px 22px; border-radius:12px; border:none; background:var(--coral); color:#fff; font-weight:700; font-size:14px; cursor:pointer;}
  .denied{color:var(--coral); font-size:14px; margin-top:14px;}
  table{width:100%; border-collapse:collapse; font-size:13px; background:var(--surface); border-radius:12px; overflow:hidden;}
  th,td{padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  th{background:var(--blue-bg); color:var(--blue); font-size:11px; text-transform:uppercase; letter-spacing:.04em;}
  tr.guardia{background:var(--warn-bg);}
  .pill{display:inline-block; padding:2px 8px; border-radius:999px; background:var(--blue-bg); color:var(--blue); font-size:11px; font-weight:700;}
  .correzione{display:flex; gap:6px; align-items:center;}
  .correzione input{width:64px; padding:5px 6px; border-radius:6px; border:1px solid var(--line);}
  .correzione button{padding:5px 10px; border-radius:6px; border:none; background:var(--ink); color:var(--bg); font-size:12px; cursor:pointer;}
  .muted{color:var(--muted); font-size:11.5px;}
  #app{display:none;}
</style>
</head>
<body>

<div class="gate" id="gate">
  <h1>QUARTO · revisione</h1>
  <p class="lead">Vista riservata: solo l'account amministratore.</p>
  <button id="btnLogin">Entra con Google</button>
  <div class="denied" id="denied" style="display:none;"></div>
</div>

<div id="app">
  <h1>Profili in calibrazione</h1>
  <p class="lead">Risposte → valore proposto. Correggi a mano quando serve, i pilastri del pilota sei tu.</p>
  <table>
    <thead>
      <tr>
        <th>Giocatore</th>
        <th>Risposte</th>
        <th>Strada</th>
        <th>Proposto</th>
        <th>Margine</th>
        <th>Correzione</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig, EMAIL_ADMIN } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById("btnLogin").addEventListener("click", () => {
  signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {
    document.getElementById("denied").style.display = "block";
    document.getElementById("denied").textContent = "Accesso non riuscito: " + e.code;
  });
});

const ETICHETTE = {
  q1: { mai: "beach: mai/quest'anno", da1a3: "beach: 1-3 anni", piuDi3: "beach: 3+ anni" },
  q2: { mai: "indoor: mai", amatoriale: "indoor: amatoriale", serieDC: "indoor: D-C", serieBplus: "indoor: B+" },
  q3: { bagher: "alza: bagher", doppi_fischiati: "alza: mani (doppi)", mani_ok: "alza: mani ok", dipende: "alza: dipende" },
  q4: { mai: "segnali: mai", ogni_tanto: "segnali: a volte", sempre_codice: "segnali: sempre" },
  q5: { non_faccio_tornei: "tornei: nessuno", scuola: "tornei: scuola", AIBVC_L2: "AIBVC L2", AIBVC_L1: "AIBVC L1", FIPAV: "FIPAV" },
  q6: { non_faccio_tornei: "vince: n/a", vince_raramente_bronze: "vince: raro nel bronze", vince_bronze_perde_silver: "vince: bronze",
        silver_se_la_gioca: "vince: se la gioca silver", vince_silver_perde_gold: "vince: silver", gold_se_la_gioca: "vince: se la gioca gold" },
};

function fmtRisposte(r){
  if (!r) return "—";
  const parts = [];
  ["q1","q2","q3","q4","q5","q6"].forEach(k => {
    if (r[k] && ETICHETTE[k] && ETICHETTE[k][r[k]]) parts.push(ETICHETTE[k][r[k]]);
  });
  let out = parts.join(" · ");
  if (r.compagni) out += '<br><span class="muted">con: ' + r.compagni + '</span>';
  return out;
}

async function caricaProfili(){
  const snap = await getDocs(collection(db, "users"));
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  snap.forEach(docSnap => {
    const d = docSnap.data();
    if (!d.autovalutazioneCompletata) return;
    const v = d.valutazione || {};
    const rev = d.revisione || {};
    const tr = document.createElement("tr");
    if (v.guardiaAttiva) tr.classList.add("guardia");
    tr.innerHTML =
      '<td><b>' + (d.nome || "—") + '</b><br><span class="muted">' + (d.telefono || "") + '</span></td>' +
      '<td>' + fmtRisposte(d.risposte) + '</td>' +
      '<td><span class="pill">' + (v.strada || "—") + '</span>' + (v.guardiaAttiva ? '<br><span class="muted">⚠️ da ricontrollare</span>' : '') + '</td>' +
      '<td><b>' + (v.valore ?? "—") + '</b><br><span class="muted">' + (v.fasciaNome || "") + '</span></td>' +
      '<td>±' + (v.margineMin === v.margineMax ? v.margineMin : v.margineMin + "/" + v.margineMax) + '</td>' +
      '<td><div class="correzione">' +
        '<input type="number" step="0.1" min="1" max="7" placeholder="' + (rev.valoreCorretto ?? "") + '" data-uid="' + docSnap.id + '">' +
        '<button data-uid="' + docSnap.id + '">Salva</button>' +
      '</div></td>';
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", async () => {
      const uid = btn.dataset.uid;
      const input = tbody.querySelector('input[data-uid="' + uid + '"]');
      const val = parseFloat(input.value);
      if (isNaN(val)) return;
      await updateDoc(doc(db, "users", uid), {
        "revisione.valoreCorretto": val,
        "revisione.correttoDa": auth.currentUser.email,
        "revisione.correttoAt": serverTimestamp(),
      });
      input.placeholder = val;
      input.value = "";
    });
  });
}

onAuthStateChanged(auth, (user) => {
  if (user && user.email === EMAIL_ADMIN) {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    caricaProfili();
  } else if (user) {
    document.getElementById("denied").style.display = "block";
    document.getElementById("denied").textContent = "Questo account (" + user.email + ") non è l'amministratore.";
  }
});
</script>
</body>
</html>
